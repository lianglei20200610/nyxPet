<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light;
        --ink: #382b18;
        --paper: rgba(255, 250, 241, 0.97);
        --accent: #f16b9d;
      }

      * {
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        font-family: Arial, sans-serif;
      }

      .pet-shell {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      .shadow {
        position: absolute;
        left: 34%;
        bottom: 5.5%;
        width: 22%;
        height: 4.5%;
        border-radius: 999px;
        background: rgba(20, 58, 82, 0.2);
        transform: translateX(-50%);
        animation: shadow 1.8s ease-in-out infinite;
        pointer-events: none;
      }

      .pet {
        position: absolute;
        left: 12%;
        bottom: 8%;
        width: 34%;
        min-width: 176px;
        max-width: 260px;
        aspect-ratio: 192 / 208;
        transform-origin: 50% 88%;
        cursor: grab;
        -webkit-app-region: no-drag;
        touch-action: none;
      }

      .pet.is-dragging {
        cursor: grabbing;
      }

      .sprite-pet {
        --sprite-col: 0;
        --sprite-row: 0;
        position: absolute;
        inset: 0;
        overflow: hidden;
        display: block;
        pointer-events: none;
        transform-origin: 50% 88%;
        animation: sprite-bob 4s ease-in-out infinite;
      }

      .sprite-sheet {
        position: absolute;
        left: 0;
        top: 0;
        width: 800%;
        height: 900%;
        max-width: none;
        object-fit: fill;
        image-rendering: auto;
        transform:
          translateX(calc(var(--sprite-col) * -12.5%))
          translateY(calc(var(--sprite-row) * -11.111111%));
      }

      .bubble {
        position: absolute;
        left: 42%;
        bottom: 39%;
        width: min(44%, 260px);
        max-height: 300px;
        min-height: 86px;
        padding: 13px 15px;
        border: 4px solid var(--ink);
        border-radius: 24px;
        background: var(--paper);
        color: #33261b;
        box-shadow: 0 10px 0 rgba(45, 38, 27, 0.12);
        opacity: 0;
        transform: translateY(12px) scale(0.92);
        transform-origin: 0 100%;
        transition: opacity 160ms ease, transform 160ms ease;
        pointer-events: none;
      }

      .bubble.show {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      .bubble.tone-good {
        background: #f0fff2;
        border-color: #1f8a4c;
      }

      .bubble.tone-bad {
        background: #fff2ef;
        border-color: #b94a3c;
      }

      .bubble.tone-urgent {
        background: #fff7df;
        border-color: #a95d1d;
      }

      .bubble.tone-soft {
        background: #f7fbff;
        border-color: #47718f;
      }

      .bubble.tone-story {
        background: #f8f2ff;
        border-color: #6c5794;
      }

      .bubble.scrollable {
        overflow-y: auto;
        pointer-events: auto;
      }

      .bubble::before {
        content: "";
        position: absolute;
        left: -10px;
        bottom: 18px;
        width: 24px;
        height: 24px;
        background: var(--paper);
        border-left: 4px solid var(--ink);
        border-bottom: 4px solid var(--ink);
        transform: rotate(45deg);
      }

      .bubble.tone-good::before,
      .bubble.tone-bad::before,
      .bubble.tone-urgent::before,
      .bubble.tone-soft::before,
      .bubble.tone-story::before {
        background: inherit;
      }

      .bubble-label {
        display: block;
        margin-bottom: 8px;
        color: #7c6754;
        font-size: 13px;
        font-weight: 700;
      }

      .bubble-text {
        display: block;
        font-size: 18px;
        font-weight: 700;
        line-height: 1.35;
        white-space: pre-line;
        overflow-wrap: anywhere;
      }

      .ledger-list {
        display: grid;
        gap: 7px;
        font-size: 13px;
        line-height: 1.32;
        white-space: normal;
      }

      .ledger-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: baseline;
        padding-bottom: 6px;
        border-bottom: 1px solid rgba(56, 43, 24, 0.12);
      }

      .ledger-row:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }

      .ledger-meta {
        color: #6f5b49;
      }

      .money-income {
        color: #138a4b;
      }

      .money-expense {
        color: #c43d37;
      }

      .event-list {
        display: grid;
        gap: 8px;
        font-size: 13px;
        line-height: 1.3;
        white-space: normal;
      }

      .event-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        padding-bottom: 7px;
        border-bottom: 1px solid rgba(56, 43, 24, 0.12);
      }

      .event-row.is-follow-up {
        padding-left: 12px;
        border-left: 3px solid rgba(108, 87, 148, 0.45);
      }

      .event-row.is-interlude {
        opacity: 0.88;
      }

      .event-row:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }

      .event-day {
        margin-top: 2px;
        color: #5f4d3e;
        font-size: 12px;
        font-weight: 800;
      }

      .event-main {
        min-width: 0;
      }

      .event-date {
        display: block;
        color: #7c6754;
        font-size: 11px;
        font-weight: 700;
      }

      .event-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 3px;
      }

      .event-tag {
        padding: 1px 5px;
        border-radius: 999px;
        background: rgba(71, 113, 143, 0.12);
        color: #5b4a3d;
        font-size: 10px;
        font-weight: 800;
      }

      .story-list {
        display: grid;
        gap: 10px;
        font-size: 13px;
        line-height: 1.32;
        white-space: normal;
      }

      .story-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-bottom: 2px;
      }

      .story-tab {
        width: auto;
        min-width: max-content;
        height: 24px;
        padding: 0 8px;
        border-width: 1px;
        border-radius: 999px;
        box-shadow: none;
        font-size: 11px;
        font-weight: 800;
        white-space: nowrap;
      }

      .story-tab.is-active {
        background: #f8d45a;
      }

      .story-row {
        padding-bottom: 9px;
        border-bottom: 1px solid rgba(56, 43, 24, 0.12);
        cursor: pointer;
      }

      .story-row:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }

      .story-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-weight: 800;
      }

      .story-status {
        flex: 0 0 auto;
        padding: 1px 6px;
        border-radius: 999px;
        background: rgba(108, 87, 148, 0.12);
        color: #604f7e;
        font-size: 10px;
        font-weight: 800;
        white-space: nowrap;
      }

      .story-text {
        display: block;
        margin-top: 4px;
        color: #5f4d3e;
      }

      .story-meta {
        display: block;
        margin-top: 3px;
        color: #8a7460;
        font-size: 11px;
        font-weight: 700;
      }

      .story-next {
        display: block;
        margin-top: 4px;
        color: #7c6754;
        font-size: 12px;
      }

      .story-detail {
        display: grid;
        gap: 6px;
        margin-top: 8px;
        padding-left: 8px;
        border-left: 3px solid rgba(108, 87, 148, 0.28);
      }

      .story-detail-row {
        display: grid;
        gap: 2px;
      }

      .story-detail-title {
        font-weight: 800;
        color: #33261b;
      }

      .story-detail-text {
        color: #5f4d3e;
      }

      .event-name {
        display: block;
        margin-top: 2px;
        color: #33261b;
        font-size: 14px;
        font-weight: 800;
        overflow-wrap: anywhere;
      }

      .event-effects {
        display: grid;
        grid-template-columns: repeat(3, auto);
        gap: 5px;
        justify-content: end;
        align-items: center;
      }

      .event-pill {
        min-width: 34px;
        padding: 3px 5px;
        border-radius: 999px;
        background: rgba(56, 43, 24, 0.08);
        text-align: center;
        font-size: 11px;
        font-weight: 800;
      }

      .event-pill.neutral {
        color: #766553;
      }

      .summary-list {
        display: grid;
        gap: 8px;
        font-size: 13px;
        line-height: 1.32;
        white-space: normal;
      }

      .summary-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        padding-bottom: 6px;
        border-bottom: 1px solid rgba(56, 43, 24, 0.12);
      }

      .stats {
        position: absolute;
        left: 6%;
        bottom: 50%;
        display: grid;
        grid-template-columns: repeat(2, auto);
        gap: 6px 10px;
        padding: 10px 12px;
        border: 3px solid var(--ink);
        border-radius: 18px;
        background: rgba(255, 250, 241, 0.92);
        color: #33261b;
        font-size: 13px;
        font-weight: 700;
        box-shadow: 0 6px 0 rgba(45, 38, 27, 0.1);
        opacity: 1;
        transform: translateY(0);
        transition: opacity 150ms ease, transform 150ms ease;
      }

      .stats.hidden {
        opacity: 0;
        transform: translateY(-8px);
        pointer-events: none;
      }

      .stats span:nth-child(odd) {
        color: #7c6754;
      }

      .stats strong {
        text-align: right;
      }

      .stats .full-row {
        grid-column: 1 / -1;
        padding-top: 2px;
        color: #766553;
        font-size: 12px;
        text-align: right;
      }

      .stats .full-row.is-debt {
        color: #c43d37;
      }

      .activity {
        position: absolute;
        left: 39%;
        bottom: 28%;
        width: min(42%, 250px);
        padding: 9px 11px;
        border: 3px solid var(--ink);
        border-radius: 16px;
        background: rgba(255, 250, 241, 0.92);
        color: #33261b;
        font-size: 13px;
        font-weight: 700;
        opacity: 0;
        transform: translateY(-6px);
        transition: opacity 150ms ease, transform 150ms ease;
      }

      .activity.show {
        opacity: 1;
        transform: translateY(0);
      }

      .activity-bar {
        width: 100%;
        height: 7px;
        margin-top: 7px;
        border-radius: 999px;
        background: rgba(56, 43, 24, 0.16);
        overflow: hidden;
      }

      .activity-fill {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: var(--accent);
      }

      .menu {
        position: absolute;
        left: 50%;
        bottom: 15%;
        display: grid;
        grid-template-columns: repeat(3, 48px);
        gap: 8px;
        opacity: 0;
        transform: translate(-50%, 10px) scale(0.92);
        transform-origin: 50% 100%;
        transition: opacity 150ms ease, transform 150ms ease;
        pointer-events: none;
      }

      .skill-prompt {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        padding: 18px;
        background: rgba(31, 25, 18, 0.26);
        pointer-events: auto;
        -webkit-app-region: no-drag;
      }

      .skill-prompt.open {
        display: grid;
      }

      .skill-prompt-panel {
        width: min(320px, 92vw);
        padding: 14px;
        border: 3px solid var(--ink);
        border-radius: 8px;
        background: var(--paper);
        color: #33261b;
        box-shadow: 0 8px 0 rgba(45, 38, 27, 0.16);
      }

      .skill-prompt-title {
        margin: 0 0 10px;
        font-size: 15px;
        font-weight: 700;
      }

      .skill-prompt-field {
        display: grid;
        gap: 5px;
        margin-bottom: 9px;
        font-size: 12px;
      }

      .skill-prompt-field input {
        width: 100%;
        min-width: 0;
        padding: 8px 9px;
        border: 2px solid rgba(56, 43, 24, 0.42);
        border-radius: 6px;
        font: inherit;
        color: #33261b;
        background: #fffdf7;
        -webkit-user-select: text;
        user-select: text;
      }

      .skill-prompt-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 12px;
      }

      .skill-prompt-actions button {
        min-width: 64px;
        height: 32px;
        border: 2px solid var(--ink);
        border-radius: 6px;
        background: #fff7df;
        color: #33261b;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .skill-prompt-actions button[data-action="confirm"] {
        background: #f8d45a;
      }

      .menu.open {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
        pointer-events: auto;
      }

      .menu.submenu {
        grid-template-columns: repeat(4, 48px);
      }

      .menu.skin-menu {
        grid-template-columns: minmax(180px, 250px);
        max-height: 270px;
        padding: 6px;
        overflow-y: auto;
        border: 2px solid rgba(56, 43, 24, 0.28);
        border-radius: 10px;
        background: rgba(255, 251, 241, 0.94);
        box-shadow: 0 8px 18px rgba(45, 38, 27, 0.16);
      }

      body.is-windows .pet {
        left: 7%;
        bottom: 9%;
        width: 38%;
        min-width: 188px;
        max-width: 248px;
      }

      body.is-windows .shadow {
        left: 26%;
        bottom: 6%;
        width: 26%;
      }

      body.is-windows .stats {
        left: 6%;
        right: auto;
        top: auto;
        bottom: 50%;
        width: 178px;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 5px 10px;
        padding: 9px 11px;
        border-width: 2px;
        border-radius: 14px;
        font-size: 12px;
        box-shadow: 0 5px 0 rgba(45, 38, 27, 0.1);
      }

      body.is-windows .stats strong {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      body.is-windows .stats .full-row {
        font-size: 11px;
      }

      body.is-windows .bubble {
        left: 41%;
        right: 14px;
        bottom: 34%;
        width: auto;
        min-height: 78px;
        max-height: 260px;
        padding: 12px 14px;
        border-width: 3px;
        border-radius: 18px;
        box-shadow: 0 7px 0 rgba(45, 38, 27, 0.11);
      }

      body.is-windows .bubble.skill-output {
        left: 33%;
        right: 12px;
        bottom: 26%;
        max-height: 390px;
        min-height: 150px;
      }

      body.is-windows .bubble::before {
        left: -9px;
        bottom: 15px;
        width: 20px;
        height: 20px;
        border-left-width: 3px;
        border-bottom-width: 3px;
      }

      body.is-windows .bubble-label {
        margin-bottom: 6px;
        font-size: 12px;
      }

      body.is-windows .bubble-text {
        font-size: 16px;
        line-height: 1.32;
      }

      body.is-windows .bubble.skill-output .bubble-text {
        font-size: 14px;
        line-height: 1.35;
      }

      body.is-windows .activity {
        left: 40%;
        right: 16px;
        bottom: 22%;
        width: auto;
        border-width: 2px;
        border-radius: 13px;
        font-size: 12px;
      }

      body.is-windows .menu {
        left: 41%;
        bottom: 7%;
        z-index: 5;
        grid-template-columns: repeat(5, 44px);
        gap: 7px;
      }

      body.is-windows .menu.submenu {
        grid-template-columns: repeat(4, 44px);
      }

      body.is-windows .menu.skin-menu {
        left: 41%;
        bottom: 7%;
        grid-template-columns: minmax(190px, 270px);
        max-height: 300px;
      }

      body.is-windows button {
        width: 44px;
        height: 44px;
        border-width: 2px;
        border-radius: 13px;
        box-shadow: 0 4px 0 rgba(45, 38, 27, 0.14);
        font-size: 20px;
      }

      .menu.skin-menu button,
      body.is-windows .menu.skin-menu button {
        width: 100%;
        height: 36px;
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
        justify-items: start;
        padding: 0 10px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1;
        text-align: left;
      }

      body.is-windows .story-tab {
        width: auto;
        min-width: max-content;
        height: 24px;
        padding: 0 8px;
        border-radius: 999px;
        font-size: 11px;
      }

      .menu-icon {
        font-size: 16px;
      }

      .menu-label {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 800;
      }

      button {
        width: 48px;
        height: 48px;
        border: 3px solid var(--ink);
        border-radius: 16px;
        background: var(--paper);
        color: var(--ink);
        box-shadow: 0 5px 0 rgba(45, 38, 27, 0.16);
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }

      .bubble,
      .stats,
      .activity,
      .menu {
        -webkit-app-region: no-drag;
      }

      button:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 rgba(45, 38, 27, 0.16);
      }

      button.has-badge {
        position: relative;
      }

      button.has-badge::after {
        content: "";
        position: absolute;
        top: 5px;
        right: 5px;
        width: 9px;
        height: 9px;
        border: 2px solid var(--paper);
        border-radius: 50%;
        background: #e33b35;
        box-shadow: 0 1px 0 rgba(45, 38, 27, 0.18);
      }

      @keyframes sprite-bob {
        0%, 100% { transform: translateY(0) rotate(-0.4deg); }
        50% { transform: translateY(-8px) rotate(0.4deg); }
      }

      .pet.is-working .sprite-pet {
        animation: sprite-bob 2.2s ease-in-out infinite;
      }

      .pet.is-exercise .sprite-pet {
        animation: sprite-bob 1.8s ease-in-out infinite;
      }

      .pet.is-food .sprite-pet {
        animation: sprite-bob 2.2s ease-in-out infinite;
      }

      .pet.is-entertainment .sprite-pet {
        animation: sprite-bob 2s ease-in-out infinite;
      }

      .pet.is-skill .sprite-pet {
        animation: sprite-bob 2s ease-in-out infinite;
      }

      body.emotion-happy .sprite-pet {
        animation: sprite-bob 1.55s ease-in-out infinite;
        filter: saturate(1.12) brightness(1.04);
      }

      body.emotion-tired .pet {
        transform: translateY(7px) scale(0.98);
      }

      body.emotion-tired .sprite-pet {
        animation: sprite-bob 5.2s ease-in-out infinite;
        filter: saturate(0.86) brightness(0.96);
      }

      body.emotion-sick .pet {
        transform: translateY(9px) rotate(-1.5deg) scale(0.97);
      }

      body.emotion-sick .sprite-pet {
        animation: sprite-bob 6s ease-in-out infinite;
        filter: saturate(0.78) brightness(0.94);
      }

      body.emotion-debt .sprite-pet {
        animation: sprite-bob 3.6s ease-in-out infinite;
        filter: saturate(0.9) contrast(1.04);
      }

      body.emotion-focused .sprite-pet {
        animation: sprite-bob 2.4s ease-in-out infinite;
        filter: saturate(1.05) contrast(1.02);
      }

      body.emotion-happy .bubble:not(.tone-bad):not(.tone-urgent):not(.tone-story) {
        background: #fff8df;
        border-color: #bf7a1f;
      }

      body.emotion-tired .bubble:not(.tone-good):not(.tone-urgent):not(.tone-story) {
        background: #f4f3ff;
        border-color: #6a6596;
      }

      body.emotion-sick .bubble:not(.tone-good):not(.tone-story) {
        background: #fff0ef;
        border-color: #b94a3c;
      }

      body.emotion-debt .bubble:not(.tone-good):not(.tone-story) {
        background: #fff7df;
        border-color: #a95d1d;
      }

      body.emotion-sick .shadow,
      body.emotion-tired .shadow {
        opacity: 0.1;
        animation-duration: 3.8s;
      }

      body.emotion-debt .stats {
        border-color: #a95d1d;
        background: rgba(255, 247, 223, 0.97);
      }

      @keyframes shadow {
        0%, 100% { transform: translateX(-50%) scaleX(1); opacity: 0.2; }
        50% { transform: translateX(-50%) scaleX(0.86); opacity: 0.12; }
      }

    </style>
  </head>
  <body>
    <main class="pet-shell">
      <div class="shadow"></div>
      <section class="pet" id="pet" aria-label="宠物">
        <span class="sprite-pet" role="img" aria-label="Goku Forms Codex 宠物">
          <img class="sprite-sheet" src="../assets/codex-pets/goku-forms/spritesheet.webp" alt="" />
        </span>
      </section>
      <aside class="bubble" id="bubble" aria-live="polite">
        <span class="bubble-label" id="bubbleLabel">小技能</span>
        <span class="bubble-text" id="bubbleText">脚本运行完成
加班 2.5 小时</span>
      </aside>
      <section class="stats" id="stats" aria-label="宠物属性">
        <span>心情</span><strong id="mood">--</strong>
        <span>体重</span><strong id="weight">--</strong>
        <span>发量</span><strong id="hair">--</strong>
        <span>健康</span><strong id="health">--</strong>
        <span>金钱</span><strong id="money">--</strong>
        <strong class="full-row" id="debt">现金正常</strong>
      </section>
      <section class="activity" id="activity" aria-label="当前行动">
        <span id="activityText">待机</span>
        <div class="activity-bar"><div class="activity-fill" id="activityFill"></div></div>
      </section>
      <nav class="menu" id="menu" aria-label="互动菜单"></nav>
      <section class="skill-prompt" id="skillPrompt" aria-hidden="true">
        <form class="skill-prompt-panel" id="skillPromptForm">
          <p class="skill-prompt-title" id="skillPromptTitle">运行技能</p>
          <div id="skillPromptFields"></div>
          <div class="skill-prompt-actions">
            <button type="button" data-action="cancel">取消</button>
            <button type="submit" data-action="confirm">运行</button>
          </div>
        </form>
      </section>
    </main>
    <script>
      if (navigator.userAgent.includes("Windows")) {
        document.body.classList.add("is-windows");
      }

      const pet = document.getElementById("pet");
      const spritePet = document.querySelector(".sprite-pet");
      const spriteSheet = document.querySelector(".sprite-sheet");
      const menu = document.getElementById("menu");
      const bubble = document.getElementById("bubble");
      const bubbleLabel = document.getElementById("bubbleLabel");
      const bubbleText = document.getElementById("bubbleText");
      const skillPrompt = document.getElementById("skillPrompt");
      const skillPromptForm = document.getElementById("skillPromptForm");
      const skillPromptTitle = document.getElementById("skillPromptTitle");
      const skillPromptFields = document.getElementById("skillPromptFields");
      const stats = document.getElementById("stats");
      const statEls = {
        mood: document.getElementById("mood"),
        weight: document.getElementById("weight"),
        hair: document.getElementById("hair"),
        health: document.getElementById("health"),
        money: document.getElementById("money"),
        debt: document.getElementById("debt")
      };
      const activity = document.getElementById("activity");
      const activityText = document.getElementById("activityText");
      const activityFill = document.getElementById("activityFill");
      let hideTimer;
      let activityTimer;
      let busy = false;
      let loadedActions = [];
      let loadedSkills = [];
      let loadedSkins = [];
      let menuMode = "root";
      let activePetClass = "";
      let spriteTimer;
      let eventModeTimer;
      let spriteFrame = 0;
      let currentMode = "";
      let currentSpriteState = "";
      let messageQueue = [];
      let queuePlaying = false;
      let latestPetState = null;
      let latestStories = [];
      let storyGroups = ["全部"];
      let activeStoryGroup = "全部";
      let expandedStoryId = "";
      let currentEmotion = "neutral";
      let temporaryEmotionTimer;

      const spriteStates = {
        idle: { row: 0, frames: 6, intervalMs: 460 },
        runningRight: { row: 1, frames: 8, intervalMs: 150 },
        runningLeft: { row: 2, frames: 8, intervalMs: 150 },
        waving: { row: 3, frames: 4, intervalMs: 240 },
        jumping: { row: 4, frames: 5, intervalMs: 200 },
        failed: { row: 5, frames: 7, intervalMs: 230 },
        waiting: { row: 6, frames: 6, intervalMs: 260 },
        running: { row: 7, frames: 6, intervalMs: 190 },
        review: { row: 8, frames: 6, intervalMs: 230 }
      };

      const categoryMeta = {
        work: { label: "工作", icon: "💼" },
        food: { label: "饮食", icon: "🍱" },
        exercise: { label: "运动", icon: "🏃" },
        entertainment: { label: "娱乐", icon: "🎲" },
        interaction: { label: "互动", icon: "🧩" },
        events: { label: "事件", icon: "📖" },
        stories: { label: "故事", icon: "📚" },
        skill: { label: "技能", icon: "✨" },
        settings: { label: "设置", icon: "⚙️" },
        developer: { label: "开发工具", icon: "🛠" }
      };
      let petSettings = { alwaysOnTop: true, unreadEvents: 0, unreadStories: 0 };
      let mousePassthrough = null;
      let petDrag = null;
      let suppressNextPetClick = false;

      function setMousePassthrough(enabled) {
        if (mousePassthrough === enabled) {
          return;
        }
        mousePassthrough = enabled;
        window.webkit?.messageHandlers?.pet?.postMessage({
          action: "setMousePassthrough",
          enabled
        });
      }

      function isInteractiveElement(element) {
        if (!element) {
          return false;
        }
        if (element.closest(".skill-prompt.open, .menu.open, .pet, button, input, textarea, select")) {
          return true;
        }
        const bubbleHit = element.closest(".bubble.show");
        if (bubbleHit && bubbleHit.classList.contains("scrollable")) {
          return true;
        }
        if (element.closest(".stats")) {
          return getComputedStyle(stats).display !== "none";
        }
        if (element.closest(".activity.show")) {
          return true;
        }
        return false;
      }

      function updateMousePassthrough(event) {
        if (!document.body.classList.contains("is-windows")) {
          return;
        }
        const target = document.elementFromPoint(event.clientX, event.clientY);
        setMousePassthrough(!isInteractiveElement(target));
      }

      function moveWindowBy(deltaX, deltaY) {
        window.webkit?.messageHandlers?.pet?.postMessage({
          action: "moveWindowBy",
          deltaX,
          deltaY
        });
      }

      function startPetDrag(event) {
        if (!document.body.classList.contains("is-windows") || event.button !== 0) {
          return;
        }
        event.preventDefault();
        event.stopPropagation();
        setMousePassthrough(false);
        pet.classList.add("is-dragging");
        pet.setPointerCapture?.(event.pointerId);
        petDrag = {
          pointerId: event.pointerId,
          lastScreenX: event.screenX,
          lastScreenY: event.screenY,
          moved: false
        };
      }

      function continuePetDrag(event) {
        if (!petDrag || event.pointerId !== petDrag.pointerId) {
          return;
        }
        event.preventDefault();
        const deltaX = event.screenX - petDrag.lastScreenX;
        const deltaY = event.screenY - petDrag.lastScreenY;
        if (Math.abs(deltaX) < 1 && Math.abs(deltaY) < 1) {
          return;
        }
        petDrag.lastScreenX = event.screenX;
        petDrag.lastScreenY = event.screenY;
        petDrag.moved = true;
        moveWindowBy(deltaX, deltaY);
      }

      function endPetDrag(event) {
        if (!petDrag || event.pointerId !== petDrag.pointerId) {
          return;
        }
        suppressNextPetClick = petDrag.moved;
        petDrag = null;
        pet.classList.remove("is-dragging");
        pet.releasePointerCapture?.(event.pointerId);
        updateMousePassthrough(event);
      }

      function emotionForState(state) {
        if (!state) {
          return "neutral";
        }
        const mood = Number(state.mood ?? 70);
        const health = Number(state.health ?? 75);
        const money = Number(state.money ?? 0);
        if (health < 35) return "sick";
        if (mood < 30) return "tired";
        if (money < 0) return "debt";
        if (mood >= 80 && health >= 60 && money >= 0) return "happy";
        return "neutral";
      }

      function spriteForEmotion(emotion) {
        return {
          happy: "waving",
          tired: "waiting",
          sick: "failed",
          debt: "review",
          focused: "review",
          neutral: "idle"
        }[emotion] || "idle";
      }

      function emotionFromTone(tone, spriteState = "") {
        if (spriteState === "failed") return "sick";
        if (spriteState === "jumping" || spriteState === "waving") return "happy";
        if (tone === "good") return "happy";
        if (tone === "bad") return "tired";
        if (tone === "urgent") return "debt";
        return "";
      }

      function emotionFromText(text) {
        const value = String(text || "");
        if (/失败|错误|超时|退出码|找不到|缺少/.test(value)) return "tired";
        if (/完成|成功|收益|收入|开心|恢复/.test(value)) return "happy";
        if (/生病|发烧|健康|医疗|感冒/.test(value)) return "sick";
        if (/负债|扣款|支出|花费/.test(value)) return "debt";
        return "";
      }

      function setEmotion(emotion) {
        const next = emotion || "neutral";
        if (currentEmotion === next) {
          return;
        }
        document.body.classList.remove("emotion-happy", "emotion-tired", "emotion-sick", "emotion-debt", "emotion-focused");
        currentEmotion = next;
        if (next !== "neutral") {
          document.body.classList.add(`emotion-${next}`);
        }
      }

      function applyBaseEmotion() {
        if (busy || currentMode === "skill" || currentMode === "event") {
          return;
        }
        const emotion = emotionForState(latestPetState);
        setEmotion(emotion);
        if (!currentMode) {
          playSpriteState(spriteForEmotion(emotion));
        }
      }

      function showTemporaryEmotion(emotion, durationMs = 1800) {
        if (!emotion) {
          return;
        }
        window.clearTimeout(temporaryEmotionTimer);
        setEmotion(emotion);
        if (!busy && !currentMode) {
          playSpriteState(spriteForEmotion(emotion));
        }
        temporaryEmotionTimer = window.setTimeout(applyBaseEmotion, Math.max(900, durationMs));
      }

      function collectSkillPromptValues(skill) {
        const prompts = Array.isArray(skill?.prompts) ? skill.prompts : [];
        if (prompts.length === 0) {
          return Promise.resolve({});
        }

        skillPromptFields.replaceChildren();
        skillPromptTitle.textContent = skill.name || "运行技能";
        const inputs = prompts.map((prompt) => {
          const field = document.createElement("label");
          field.className = "skill-prompt-field";
          field.textContent = `${prompt.label || prompt.id}${prompt.hasSaved ? "（已保存，留空沿用）" : ""}`;

          const input = document.createElement("input");
          input.type = prompt.secret ? "password" : "text";
          input.name = prompt.id;
          input.autocomplete = "off";
          input.value = prompt.defaultValue || "";
          input.placeholder = prompt.hasSaved ? "留空使用上次保存的值" : "";
          input.required = prompt.required !== false && !prompt.hasSaved && !input.value;
          field.appendChild(input);
          skillPromptFields.appendChild(field);
          return input;
        });

        skillPrompt.classList.add("open");
        skillPrompt.setAttribute("aria-hidden", "false");
        inputs[0]?.focus();

        return new Promise((resolve) => {
          const close = (value) => {
            skillPrompt.classList.remove("open");
            skillPrompt.setAttribute("aria-hidden", "true");
            skillPromptForm.removeEventListener("submit", onSubmit);
            skillPromptForm.querySelector('[data-action="cancel"]').removeEventListener("click", onCancel);
            resolve(value);
          };
          const onSubmit = (event) => {
            event.preventDefault();
            const values = {};
            for (const input of inputs) {
              values[input.name] = input.value;
            }
            close(values);
          };
          const onCancel = () => close(null);
          skillPromptForm.addEventListener("submit", onSubmit);
          skillPromptForm.querySelector('[data-action="cancel"]').addEventListener("click", onCancel);
        });
      }

      function resetBubbleContent() {
        bubble.classList.remove("scrollable");
        bubble.classList.remove("skill-output");
        bubble.classList.remove("tone-good", "tone-bad", "tone-urgent", "tone-soft", "tone-story");
        bubbleText.className = "bubble-text";
        bubbleText.replaceChildren();
      }

      function say(text, label = "宠物", durationMs = 5200, tone = "") {
        window.clearTimeout(hideTimer);
        resetBubbleContent();
        if (tone) {
          bubble.classList.add(`tone-${tone}`);
        }
        bubbleLabel.textContent = label;
        bubbleText.textContent = text;
        bubble.classList.add("show");
        hideTimer = window.setTimeout(() => bubble.classList.remove("show"), durationMs);
      }

      function skillResultDuration(text) {
        const length = String(text || "").length;
        return Math.min(60000, Math.max(20000, 12000 + length * 35));
      }

      function showSkillResult(result) {
        const text = result.text || "脚本运行完成";
        window.clearTimeout(hideTimer);
        resetBubbleContent();
        bubble.classList.add("scrollable", "skill-output");
        bubbleLabel.textContent = result.label || "小技能";
        bubbleText.textContent = text;
        bubble.classList.add("show");
        hideTimer = window.setTimeout(() => bubble.classList.remove("show"), skillResultDuration(text));
      }

      function enqueueBubble(text, label = "宠物", durationMs = 3600, priority = "normal", options = {}) {
        const item = { text, label, durationMs, ...options };
        if (priority === "urgent") {
          messageQueue.unshift(item);
        } else {
          messageQueue.push(item);
        }
        playBubbleQueue();
      }

      function playBubbleQueue() {
        if (queuePlaying || messageQueue.length === 0) {
          return;
        }
        queuePlaying = true;
        const item = messageQueue.shift();
        if (item.spriteState) {
          showEventPetReaction(item.spriteState, item.durationMs);
        } else if (item.emotion) {
          showTemporaryEmotion(item.emotion, item.durationMs);
        }
        say(item.text, item.label, item.durationMs, item.tone || "");
        window.setTimeout(() => {
          queuePlaying = false;
          playBubbleQueue();
        }, item.durationMs + 300);
      }

      function moneyClass(amount) {
        const value = Number(amount) || 0;
        if (value > 0) return "money-income";
        if (value < 0) return "money-expense";
        return "neutral";
      }

      function signed(amount) {
        const value = Number(amount) || 0;
        return value > 0 ? `+${value}` : `${value}`;
      }

      function formatMoney(amount) {
        const value = Number(amount) || 0;
        return new Intl.NumberFormat("zh-CN", {
          style: "currency",
          currency: "CNY",
          maximumFractionDigits: 0
        }).format(value);
      }

      function debtLabelForMoney(amount, debt) {
        const value = Number(amount) || 0;
        if (value >= 0) return "";
        if (debt?.label) return debt.label;
        if (value > -10000) return "轻微透支";
        if (value > -50000) return "压力负债";
        return "严重负债";
      }

      function showLedger(entries) {
        window.clearTimeout(hideTimer);
        resetBubbleContent();
        bubble.classList.add("scrollable");
        bubbleLabel.textContent = "账本";
        const list = document.createElement("span");
        list.className = "ledger-list";
        if (!entries || entries.length === 0) {
          list.textContent = "账本还是空的\n等发生收入或支出后会记录在这里";
        } else {
          for (const entry of entries) {
            const row = document.createElement("span");
            row.className = "ledger-row";
            const meta = document.createElement("span");
            meta.className = "ledger-meta";
            meta.textContent = `${entry.date} ${entry.name}`;
            const amount = document.createElement("strong");
            amount.className = moneyClass(entry.amount);
            amount.textContent = `${signed(entry.amount)} / ${entry.balanceAfter}`;
            row.append(meta, amount);
            list.appendChild(row);
          }
        }
        bubbleText.appendChild(list);
        bubble.classList.add("show");
        hideTimer = window.setTimeout(() => bubble.classList.remove("show"), 52000);
      }

      function showEvents(entries) {
        window.clearTimeout(hideTimer);
        resetBubbleContent();
        bubble.classList.add("scrollable");
        bubbleLabel.textContent = "事件";
        const list = document.createElement("span");
        list.className = "event-list";
        if (!entries || entries.length === 0) {
          list.textContent = "暂无事件记录\n有生活事件发生后会记录在这里";
        } else {
          let currentDate = "";
          for (const entry of entries) {
            if (entry.date !== currentDate) {
              currentDate = entry.date;
              const day = document.createElement("span");
              day.className = "event-day";
              day.textContent = currentDate;
              list.appendChild(day);
            }
            const row = document.createElement("span");
            row.className = "event-row";
            if (entry.source === "followUp") row.classList.add("is-follow-up");
            if (entry.source === "realtime") row.classList.add("is-interlude");
            const main = document.createElement("span");
            main.className = "event-main";
            const date = document.createElement("span");
            date.className = "event-date";
            date.textContent = entry.category || "生活事件";
            const name = document.createElement("span");
            name.className = "event-name";
            name.textContent = entry.name;
            main.append(date, name);
            if (entry.storyLabel || entry.source) {
              const tags = document.createElement("span");
              tags.className = "event-tags";
              const storyTag = document.createElement("span");
              storyTag.className = "event-tag";
              storyTag.textContent = entry.storyLabel || (entry.source === "realtime" ? "在线插曲" : "生活事件");
              tags.appendChild(storyTag);
              if (entry.source === "followUp") {
                const followTag = document.createElement("span");
                followTag.className = "event-tag";
                followTag.textContent = "后续";
                tags.appendChild(followTag);
              }
              main.appendChild(tags);
            }

            const effects = document.createElement("span");
            effects.className = "event-effects";
            for (const [label, value] of [["钱", entry.moneyDelta || 0], ["心", entry.moodDelta || 0], ["康", entry.healthDelta || 0]]) {
              const pill = document.createElement("span");
              pill.className = `event-pill ${moneyClass(value)}`;
              pill.textContent = `${label}${signed(value)}`;
              effects.appendChild(pill);
            }
            row.append(main, effects);
            list.appendChild(row);
          }
        }
        bubbleText.appendChild(list);
        bubble.classList.add("show");
        hideTimer = window.setTimeout(() => bubble.classList.remove("show"), 52000);
      }

      function showStories(stories, groups = ["全部"], activeGroup = "全部", expandedStoryId = "") {
        window.clearTimeout(hideTimer);
        resetBubbleContent();
        bubble.classList.add("scrollable");
        bubbleLabel.textContent = "故事";
        const list = document.createElement("span");
        list.className = "story-list";
        const visibleStories = (stories || []).filter((story) => activeGroup === "全部" || story.group === activeGroup);

        if (groups.length > 1) {
          const tabs = document.createElement("span");
          tabs.className = "story-tabs";
          for (const group of groups) {
            const tab = document.createElement("button");
            tab.type = "button";
            tab.className = `story-tab${group === activeGroup ? " is-active" : ""}`;
            tab.textContent = group;
            tab.dataset.action = "filterStory";
            tab.dataset.group = group;
            tabs.appendChild(tab);
          }
          list.appendChild(tabs);
        }

        if (!visibleStories || visibleStories.length === 0) {
          list.textContent = "暂无进行中的故事\n有连续事件发生后会整理在这里";
        } else {
          for (const story of visibleStories) {
            const row = document.createElement("span");
            row.className = "story-row";
            row.dataset.action = "toggleStory";
            row.dataset.storyId = story.id;
            const title = document.createElement("span");
            title.className = "story-title";
            const name = document.createElement("span");
            name.textContent = story.title;
            title.appendChild(name);
            if (story.status) {
              const status = document.createElement("span");
              status.className = "story-status";
              status.textContent = story.status;
              title.appendChild(status);
            }
            const text = document.createElement("span");
            text.className = "story-text";
            text.textContent = story.summary;
            row.append(title, text);
            const meta = document.createElement("span");
            meta.className = "story-meta";
            meta.textContent = `${story.group || "其他"} · ${story.count || 0} 条 · 最近 ${story.latestDate || "-"}`;
            row.appendChild(meta);
            if (story.next) {
              const next = document.createElement("span");
              next.className = "story-next";
              next.textContent = story.next;
              row.appendChild(next);
            }
            if (story.id === expandedStoryId) {
              const detail = document.createElement("span");
              detail.className = "story-detail";
              const timeline = Array.isArray(story.timeline) ? story.timeline : [];
              for (const entry of timeline) {
                const item = document.createElement("span");
                item.className = "story-detail-row";
                const itemTitle = document.createElement("span");
                itemTitle.className = "story-detail-title";
                itemTitle.textContent = `${entry.date || ""} ${entry.name || ""}`;
                const itemText = document.createElement("span");
                itemText.className = "story-detail-text";
                itemText.textContent = `${entry.message || ""} 钱${signed(entry.moneyDelta || 0)} 心${signed(entry.moodDelta || 0)} 康${signed(entry.healthDelta || 0)}`;
                item.append(itemTitle, itemText);
                detail.appendChild(item);
              }
              row.appendChild(detail);
            }
            list.appendChild(row);
          }
        }
        bubbleText.appendChild(list);
        bubble.classList.add("show");
        hideTimer = window.setTimeout(() => bubble.classList.remove("show"), 52000);
      }

      function showLedgerStats(stats) {
        window.clearTimeout(hideTimer);
        resetBubbleContent();
        bubble.classList.add("scrollable");
        bubbleLabel.textContent = `${stats.month || "本月"}统计`;
        const list = document.createElement("span");
        list.className = "summary-list";
        const rows = [
          ["收入", stats.income || 0],
          ["支出", stats.expense || 0],
          ["结余", stats.net || 0],
          ...Object.entries(stats.categories || {})
        ];
        for (const [label, value] of rows) {
          const row = document.createElement("span");
          row.className = "summary-row";
          const name = document.createElement("span");
          name.textContent = label;
          const amount = document.createElement("strong");
          amount.className = moneyClass(value);
          amount.textContent = signed(value);
          row.append(name, amount);
          list.appendChild(row);
        }
        bubbleText.appendChild(list);
        bubble.classList.add("show");
        hideTimer = window.setTimeout(() => bubble.classList.remove("show"), 52000);
      }

      function setSpriteFrame(row, col) {
        spritePet.style.setProperty("--sprite-row", row);
        spritePet.style.setProperty("--sprite-col", col);
      }

      function playSpriteState(stateName) {
        const state = spriteStates[stateName] || spriteStates.idle;
        window.clearInterval(spriteTimer);
        spriteFrame = 0;
        setSpriteFrame(state.row, 0);
        spriteTimer = window.setInterval(() => {
          spriteFrame = (spriteFrame + 1) % state.frames;
          setSpriteFrame(state.row, spriteFrame);
        }, state.intervalMs);
      }

      function setPetMode(mode, preferredSpriteState = "") {
        currentMode = mode || "";
        currentSpriteState = preferredSpriteState || "";
        const modeClass = {
          work: "working",
          food: "food",
          exercise: "exercise",
          entertainment: "entertainment",
          skill: "skill"
        }[mode] || mode;

        if (activePetClass) {
          pet.classList.remove(activePetClass);
        }

        activePetClass = modeClass ? `is-${modeClass}` : "";
        if (activePetClass) {
          pet.classList.add(activePetClass);
        }

        const stateName = preferredSpriteState || {
          working: "running",
          food: "waving",
          exercise: "jumping",
          entertainment: "waiting",
          skill: "review"
        }[modeClass] || spriteForEmotion(currentEmotion);
        playSpriteState(stateName);
      }

      function showEventPetReaction(spriteState, durationMs) {
        if (busy) return;
        const previousMode = currentMode;
        const previousSpriteState = currentSpriteState;
        const previousEmotion = currentEmotion;
        window.clearTimeout(eventModeTimer);
        setPetMode("event", spriteState);
        const reactionEmotion = emotionFromTone("", spriteState);
        if (reactionEmotion) {
          setEmotion(reactionEmotion);
        }
        eventModeTimer = window.setTimeout(() => {
          if (!busy) {
            setPetMode(previousMode, previousSpriteState);
            if (previousMode) {
              setEmotion(previousEmotion);
            } else {
              applyBaseEmotion();
            }
          }
        }, Math.max(1200, durationMs - 300));
      }

      function actionEffectTitle(action) {
        const parts = [`${action.name} · ${Math.round(action.durationSeconds)}秒`];
        if (Number(action.moneyDelta || 0) !== 0) parts.push(`金钱${signed(action.moneyDelta)}`);
        if (Number(action.moodDelta || 0) !== 0) parts.push(`心情${signed(action.moodDelta)}`);
        if (Number(action.healthDelta || 0) !== 0) parts.push(`健康${signed(action.healthDelta)}`);
        return parts.join(" · ");
      }

      playSpriteState("idle");

      window.petSkillResult = (result) => {
        if (activePetClass === "is-skill") {
          setPetMode("");
        }
        showTemporaryEmotion(emotionFromText(result?.text), 2200);
        showSkillResult(result);
      };

      window.petStateUpdated = (state) => {
        latestPetState = state;
        statEls.mood.textContent = state.mood;
        statEls.weight.textContent = state.weight;
        statEls.hair.textContent = state.hair;
        statEls.health.textContent = state.health ?? "--";
        statEls.money.textContent = formatMoney(state.money);
        const debtLabel = debtLabelForMoney(state.money, state.debt);
        if (Number(state.money || 0) < 0) {
          statEls.money.title = debtLabel;
          statEls.money.className = "money-expense";
          statEls.debt.textContent = debtLabel;
          statEls.debt.classList.add("is-debt");
        } else if (Number(state.money || 0) === 0) {
          statEls.money.title = "现金为 0";
          statEls.money.className = "";
          statEls.debt.textContent = "现金为 0";
          statEls.debt.classList.remove("is-debt");
        } else {
          statEls.money.title = "";
          statEls.money.className = "";
          statEls.debt.textContent = "现金正常";
          statEls.debt.classList.remove("is-debt");
        }
        applyBaseEmotion();
      };

      window.petLedgerResult = (payload) => {
        showLedger(payload.entries || []);
      };

      window.petEventLogResult = (payload) => {
        showEvents(payload.entries || []);
      };

      window.petStoryResult = (payload) => {
        latestStories = payload.stories || [];
        storyGroups = payload.groups || ["全部"];
        if (!storyGroups.includes(activeStoryGroup)) {
          activeStoryGroup = "全部";
        }
        showStories(latestStories, storyGroups, activeStoryGroup, expandedStoryId);
      };

      window.petLedgerStatsResult = (payload) => {
        showLedgerStats(payload.stats || {});
      };

      window.petQueueEventMessages = (messages) => {
        const items = Array.isArray(messages) ? messages.slice(0, 4) : [];
        items.forEach((message, index) => {
          const duration = message.durationMs || (message.severity === "urgent" ? 7600 : 4200);
          enqueueBubble(message.text, message.label || "生活事件", duration, message.severity, {
            tone: message.tone || "",
            spriteState: message.spriteState || "",
            emotion: emotionFromTone(message.tone || "", message.spriteState || "")
          });
        });
      };

      window.petSettingsUpdated = (settings) => {
        petSettings = settings;
        if (settings.skinSpritesheetUrl) {
          spriteSheet.src = settings.skinSpritesheetUrl;
          spriteSheet.alt = settings.skinName || settings.skinId || "";
        }
        document.getElementById("stats").classList.toggle("hidden", !settings.showStats);
        if (menu.classList.contains("open") && menuMode === "settings") {
          renderCategoryMenu("settings");
        }
      };

      window.petUnreadUpdated = (payload) => {
        petSettings = {
          ...petSettings,
          unreadEvents: Number(payload?.events || 0),
          unreadStories: Number(payload?.stories || 0)
        };
        if (menu.classList.contains("open") && menuMode === "root") {
          renderRootMenu();
        }
      };

      window.petLoadActions = (actions) => {
        loadedActions = actions;
        renderRootMenu();
      };

      window.petLoadSkills = (skills) => {
        loadedSkills = skills;
        renderRootMenu();
      };

      window.petLoadSkins = (skins) => {
        loadedSkins = Array.isArray(skins) ? skins : [];
        renderRootMenu();
      };

      function clearMenu() {
        menu.replaceChildren();
      }

      function createMenuButton({ icon, title, dataset, label, badge }) {
        const button = document.createElement("button");
        button.type = "button";
        button.title = title;
        if (badge) {
          button.classList.add("has-badge");
          button.setAttribute("aria-label", `${title}，有新内容`);
        }
        if (label) {
          const iconElement = document.createElement("span");
          iconElement.className = "menu-icon";
          iconElement.textContent = icon;
          const labelElement = document.createElement("span");
          labelElement.className = "menu-label";
          labelElement.textContent = label;
          button.append(iconElement, labelElement);
        } else {
          button.textContent = icon;
        }
        for (const [key, value] of Object.entries(dataset)) {
          button.dataset[key] = value;
        }
        return button;
      }

      function renderRootMenu() {
        menuMode = "root";
        menu.classList.remove("submenu", "skin-menu");
        clearMenu();

        if (loadedSkills.length > 0) {
          menu.appendChild(createMenuButton({
            icon: categoryMeta.skill.icon,
            title: categoryMeta.skill.label,
            dataset: { action: "openCategory", category: "skill" }
          }));
        }

        menu.appendChild(createMenuButton({
          icon: categoryMeta.events.icon,
          title: categoryMeta.events.label,
          dataset: { action: "showEvents" },
          badge: Number(petSettings.unreadEvents || 0) > 0
        }));
        menu.appendChild(createMenuButton({
          icon: categoryMeta.stories.icon,
          title: categoryMeta.stories.label,
          dataset: { action: "showStories" },
          badge: Number(petSettings.unreadStories || 0) > 0
        }));

        if (loadedActions.length > 0) {
          menu.appendChild(createMenuButton({
            icon: categoryMeta.interaction.icon,
            title: categoryMeta.interaction.label,
            dataset: { action: "openCategory", category: "interaction" }
          }));
        }

        menu.appendChild(createMenuButton({
          icon: categoryMeta.settings.icon,
          title: categoryMeta.settings.label,
          dataset: { action: "openCategory", category: "settings" }
        }));
        if (document.body.classList.contains("is-windows")) {
          menu.classList.add("open");
        }
      }

      function renderCategoryMenu(category) {
        menuMode = category;
        menu.classList.add("submenu");
        menu.classList.toggle("skin-menu", category === "skin");
        clearMenu();

        menu.appendChild(createMenuButton({
          icon: "←",
          title: "返回",
          dataset: { action: "back" }
        }));

        if (category === "skill") {
          for (const skill of loadedSkills) {
            menu.appendChild(createMenuButton({
              icon: skill.icon || "✨",
              title: skill.name,
              dataset: {
                action: "skill",
                skillId: skill.id,
                skillName: skill.name
              }
            }));
          }
          return;
        }

        if (category === "interaction") {
          for (const action of loadedActions) {
            menu.appendChild(createMenuButton({
              icon: action.icon || "•",
              title: actionEffectTitle(action),
              dataset: {
                action: "petAction",
                actionId: action.id,
                actionName: action.name
              }
            }));
          }
          return;
        }

        if (category === "settings") {
          menu.appendChild(createMenuButton({
            icon: petSettings.alwaysOnTop ? "📌" : "📍",
            title: petSettings.alwaysOnTop ? "关闭置顶" : "开启置顶",
            dataset: { action: "toggleAlwaysOnTop" }
          }));
          menu.appendChild(createMenuButton({
            icon: petSettings.showStats ? "📊" : "▣",
            title: petSettings.showStats ? "隐藏状态面板" : "显示状态面板",
            dataset: { action: "toggleStats" }
          }));
          if (loadedSkins.length > 0) {
            menu.appendChild(createMenuButton({
              icon: "🎨",
              title: "换皮肤",
              dataset: { action: "openCategory", category: "skin" }
            }));
          }
          menu.appendChild(createMenuButton({
            icon: "账",
            title: "查看账本",
            dataset: { action: "showLedger" }
          }));
          menu.appendChild(createMenuButton({
            icon: "统",
            title: "月度统计",
            dataset: { action: "showLedgerStats" }
          }));
          menu.appendChild(createMenuButton({
            icon: categoryMeta.developer.icon,
            title: categoryMeta.developer.label,
            dataset: { action: "openCategory", category: "developer" }
          }));
          menu.appendChild(createMenuButton({
            icon: "⏻",
            title: "退出",
            dataset: { action: "quit" }
          }));
          return;
        }

        if (category === "skin") {
          for (const skin of loadedSkins) {
            const isCurrent = skin.id === petSettings.skinId;
            const skinName = skin.displayName || skin.id;
            menu.appendChild(createMenuButton({
              icon: isCurrent ? "✓" : "🎨",
              title: `${skinName}${isCurrent ? " · 当前" : ""}`,
              label: `${skinName}${isCurrent ? " · 当前" : ""}`,
              dataset: {
                action: "selectSkin",
                skinId: skin.id
              }
            }));
          }
          return;
        }

        if (category === "developer") {
          const tools = [
            ["📋", "事件调试状态", { action: "showEventDebug" }],
            ["⏭", "推进一天结算", { action: "debugAdvanceDay" }],
            ["☁", "设为低心情", { action: "debugSetStatePreset", preset: "lowMood" }],
            ["✚", "设为低健康", { action: "debugSetStatePreset", preset: "lowHealth" }],
            ["￥", "设为负债", { action: "debugSetStatePreset", preset: "debt" }],
            ["↺", "重置默认值", { action: "debugResetState" }]
          ];
          for (const [icon, title, dataset] of tools) {
            menu.appendChild(createMenuButton({ icon, title, dataset }));
          }
          return;
        }

        for (const action of loadedActions.filter((item) => item.category === category)) {
          menu.appendChild(createMenuButton({
            icon: action.icon || "•",
            title: actionEffectTitle(action),
            dataset: {
              action: "petAction",
              actionId: action.id,
              actionName: action.name
            }
          }));
        }
      }

      window.petActivityStarted = (action) => {
        busy = true;
        window.clearTimeout(temporaryEmotionTimer);
        setEmotion("focused");
        window.clearInterval(activityTimer);
        const duration = Math.max(1, Number(action.durationSeconds) || 1);
        const startedAt = Date.now();
        const activeAction = loadedActions.find((item) => item.id === action.id);
        setPetMode(action.mode || activeAction?.mode || activeAction?.category || "working", action.spriteState || activeAction?.spriteState || "");
        activityText.textContent = `${action.name}中 · ${duration}秒`;
        activity.classList.add("show");
        activityFill.style.width = "0%";
        activityTimer = window.setInterval(() => {
          const elapsed = (Date.now() - startedAt) / 1000;
          const progress = Math.min(1, elapsed / duration);
          activityFill.style.width = `${Math.round(progress * 100)}%`;
          const left = Math.max(0, Math.ceil(duration - elapsed));
          activityText.textContent = `${action.name}中 · ${left}秒`;
        }, 200);
      };

      window.petActivityEnded = () => {
        busy = false;
        setPetMode("");
        applyBaseEmotion();
        window.clearInterval(activityTimer);
        activityFill.style.width = "100%";
        window.setTimeout(() => {
          activity.classList.remove("show");
          activityText.textContent = "待机";
          activityFill.style.width = "0%";
        }, 700);
      };

      if (document.body.classList.contains("is-windows")) {
        setMousePassthrough(true);
        document.addEventListener("mousemove", updateMousePassthrough);
        document.addEventListener("pointerdown", updateMousePassthrough);
        document.addEventListener("mouseleave", () => setMousePassthrough(true));
        pet.addEventListener("pointerdown", startPetDrag);
        pet.addEventListener("pointermove", continuePetDrag);
        pet.addEventListener("pointerup", endPetDrag);
        pet.addEventListener("pointercancel", endPetDrag);
      }

      pet.addEventListener("click", (event) => {
        event.stopPropagation();
        if (suppressNextPetClick) {
          suppressNextPetClick = false;
          return;
        }
        if (document.body.classList.contains("is-windows")) {
          renderRootMenu();
          return;
        }
        if (!menu.classList.contains("open")) {
          renderRootMenu();
        }
        menu.classList.toggle("open");
      });

      document.addEventListener("click", () => {
        if (document.body.classList.contains("is-windows")) {
          renderRootMenu();
          return;
        }
        menu.classList.remove("open");
        renderRootMenu();
      });

      document.addEventListener("contextmenu", (event) => {
        event.preventDefault();
        if (document.body.classList.contains("is-windows")) {
          renderRootMenu();
          return;
        }
        menu.classList.remove("open");
        renderRootMenu();
      });

      menu.addEventListener("click", async (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        event.stopPropagation();
        if (button.dataset.action === "openCategory") {
          renderCategoryMenu(button.dataset.category);
          return;
        }
        if (button.dataset.action === "back") {
          renderRootMenu();
          return;
        }
        if (button.dataset.action === "toggleAlwaysOnTop") {
          window.webkit?.messageHandlers?.pet?.postMessage({
            action: "toggleAlwaysOnTop"
          });
          return;
        }
        if (button.dataset.action === "toggleStats") {
          window.webkit?.messageHandlers?.pet?.postMessage({
            action: "toggleStats"
          });
          return;
        }
        if (button.dataset.action === "selectSkin") {
          window.webkit?.messageHandlers?.pet?.postMessage({
            action: "selectSkin",
            skinId: button.dataset.skinId
          });
          menu.classList.remove("open");
          renderRootMenu();
          return;
        }
        if (button.dataset.action === "showEvents") {
          window.webkit?.messageHandlers?.pet?.postMessage({
            action: "showEvents"
          });
          menu.classList.remove("open");
          renderRootMenu();
          return;
        }
        if (button.dataset.action === "showStories") {
          window.webkit?.messageHandlers?.pet?.postMessage({
            action: "showStories"
          });
          menu.classList.remove("open");
          renderRootMenu();
          return;
        }
        if (button.dataset.action === "showLedger") {
          window.webkit?.messageHandlers?.pet?.postMessage({
            action: "showLedger"
          });
          return;
        }
        if (button.dataset.action === "showLedgerStats") {
          window.webkit?.messageHandlers?.pet?.postMessage({
            action: button.dataset.action
          });
          return;
        }
        if (["showEventDebug", "debugAdvanceDay", "debugResetState"].includes(button.dataset.action)) {
          window.webkit?.messageHandlers?.pet?.postMessage({
            action: button.dataset.action
          });
          menu.classList.remove("open");
          renderRootMenu();
          return;
        }
        if (button.dataset.action === "debugSetStatePreset") {
          window.webkit?.messageHandlers?.pet?.postMessage({
            action: "debugSetStatePreset",
            preset: button.dataset.preset
          });
          menu.classList.remove("open");
          renderRootMenu();
          return;
        }
        if (button.dataset.action === "quit") {
          window.webkit?.messageHandlers?.pet?.postMessage({
            action: "quit"
          });
          return;
        }
        if (button.dataset.action === "skill") {
          if (busy) {
            say("现在正在忙\n等当前行动结束再用小技能吧", "宠物");
            menu.classList.remove("open");
            renderRootMenu();
            return;
          }
          const skill = loadedSkills.find((item) => item.id === button.dataset.skillId);
          const skillName = button.dataset.skillName || skill?.name || "小技能";
          const promptValues = await collectSkillPromptValues(skill);
          if (promptValues === null) {
            menu.classList.remove("open");
            renderRootMenu();
            return;
          }
          setPetMode("skill");
          setEmotion("focused");
          say("正在运行脚本...", skillName);
          window.webkit?.messageHandlers?.pet?.postMessage({
            action: "runSkill",
            skillId: button.dataset.skillId,
            promptValues
          });
        } else if (button.dataset.action === "petAction") {
          if (busy) {
            say("现在正在忙\n等当前行动结束再来吧", "宠物");
            menu.classList.remove("open");
            renderRootMenu();
            return;
          }
          say("准备开始...", button.dataset.actionName || "行动");
          window.webkit?.messageHandlers?.pet?.postMessage({
            action: "petAction",
            actionId: button.dataset.actionId
          });
        } else {
          const [text, label] = button.dataset.say.split("|");
          say(text, label);
        }
        menu.classList.remove("open");
        renderRootMenu();
      });

      bubble.addEventListener("click", (event) => {
        const filter = event.target.closest("[data-action='filterStory']");
        if (filter) {
          event.stopPropagation();
          activeStoryGroup = filter.dataset.group || "全部";
          expandedStoryId = "";
          showStories(latestStories, storyGroups, activeStoryGroup, expandedStoryId);
          return;
        }

        const row = event.target.closest("[data-action='toggleStory']");
        if (row) {
          event.stopPropagation();
          expandedStoryId = expandedStoryId === row.dataset.storyId ? "" : row.dataset.storyId;
          showStories(latestStories, storyGroups, activeStoryGroup, expandedStoryId);
        }
      });

      dragZone.addEventListener("pointerdown", () => {
        window.webkit?.messageHandlers?.pet?.postMessage("drag");
      });
    </script>
  </body>
</html>
