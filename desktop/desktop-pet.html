<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light;
        --ink: #382b18;
        --paper: rgba(255, 250, 241, 0.97);
        --accent: #f16b9d;
      }

      * {
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        font-family: Arial, sans-serif;
      }

      .pet-shell {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      .drag-zone {
        position: absolute;
        inset: 0;
        cursor: grab;
        -webkit-app-region: drag;
      }

      .shadow {
        position: absolute;
        left: 34%;
        bottom: 5.5%;
        width: 22%;
        height: 4.5%;
        border-radius: 999px;
        background: rgba(20, 58, 82, 0.2);
        transform: translateX(-50%);
        animation: shadow 1.8s ease-in-out infinite;
        pointer-events: none;
      }

      .pet {
        position: absolute;
        left: 12%;
        bottom: 8%;
        width: 34%;
        min-width: 176px;
        max-width: 260px;
        aspect-ratio: 192 / 208;
        transform-origin: 50% 88%;
        cursor: pointer;
        -webkit-app-region: drag;
      }

      .sprite-pet {
        --sprite-col: 0;
        --sprite-row: 0;
        position: absolute;
        inset: 0;
        overflow: hidden;
        display: block;
        pointer-events: none;
        transform-origin: 50% 88%;
        animation: sprite-bob 4s ease-in-out infinite;
      }

      .sprite-sheet {
        position: absolute;
        left: 0;
        top: 0;
        width: 800%;
        height: 900%;
        max-width: none;
        object-fit: fill;
        image-rendering: auto;
        transform:
          translateX(calc(var(--sprite-col) * -12.5%))
          translateY(calc(var(--sprite-row) * -11.111111%));
      }

      .bubble {
        position: absolute;
        left: 42%;
        bottom: 39%;
        width: min(44%, 260px);
        max-height: 300px;
        min-height: 86px;
        padding: 13px 15px;
        border: 4px solid var(--ink);
        border-radius: 24px;
        background: var(--paper);
        color: #33261b;
        box-shadow: 0 10px 0 rgba(45, 38, 27, 0.12);
        opacity: 0;
        transform: translateY(12px) scale(0.92);
        transform-origin: 0 100%;
        transition: opacity 160ms ease, transform 160ms ease;
        pointer-events: none;
      }

      .bubble.show {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      .bubble.tone-good {
        background: #f0fff2;
        border-color: #1f8a4c;
      }

      .bubble.tone-bad {
        background: #fff2ef;
        border-color: #b94a3c;
      }

      .bubble.tone-urgent {
        background: #fff7df;
        border-color: #a95d1d;
      }

      .bubble.tone-soft {
        background: #f7fbff;
        border-color: #47718f;
      }

      .bubble.tone-story {
        background: #f8f2ff;
        border-color: #6c5794;
      }

      .bubble.scrollable {
        overflow-y: auto;
        pointer-events: auto;
      }

      .bubble::before {
        content: "";
        position: absolute;
        left: -10px;
        bottom: 18px;
        width: 24px;
        height: 24px;
        background: var(--paper);
        border-left: 4px solid var(--ink);
        border-bottom: 4px solid var(--ink);
        transform: rotate(45deg);
      }

      .bubble.tone-good::before,
      .bubble.tone-bad::before,
      .bubble.tone-urgent::before,
      .bubble.tone-soft::before,
      .bubble.tone-story::before {
        background: inherit;
      }

      .bubble-label {
        display: block;
        margin-bottom: 8px;
        color: #7c6754;
        font-size: 13px;
        font-weight: 700;
      }

      .bubble-text {
        display: block;
        font-size: 18px;
        font-weight: 700;
        line-height: 1.35;
        white-space: pre-line;
        overflow-wrap: anywhere;
      }

      .ledger-list {
        display: grid;
        gap: 7px;
        font-size: 13px;
        line-height: 1.32;
        white-space: normal;
      }

      .ledger-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: baseline;
        padding-bottom: 6px;
        border-bottom: 1px solid rgba(56, 43, 24, 0.12);
      }

      .ledger-row:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }

      .ledger-meta {
        color: #6f5b49;
      }

      .money-income {
        color: #138a4b;
      }

      .money-expense {
        color: #c43d37;
      }

      .event-list {
        display: grid;
        gap: 8px;
        font-size: 13px;
        line-height: 1.3;
        white-space: normal;
      }

      .event-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        padding-bottom: 7px;
        border-bottom: 1px solid rgba(56, 43, 24, 0.12);
      }

      .event-row.is-follow-up {
        padding-left: 12px;
        border-left: 3px solid rgba(108, 87, 148, 0.45);
      }

      .event-row.is-interlude {
        opacity: 0.88;
      }

      .event-row:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }

      .event-day {
        margin-top: 2px;
        color: #5f4d3e;
        font-size: 12px;
        font-weight: 800;
      }

      .event-main {
        min-width: 0;
      }

      .event-date {
        display: block;
        color: #7c6754;
        font-size: 11px;
        font-weight: 700;
      }

      .event-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 3px;
      }

      .event-tag {
        padding: 1px 5px;
        border-radius: 999px;
        background: rgba(71, 113, 143, 0.12);
        color: #5b4a3d;
        font-size: 10px;
        font-weight: 800;
      }

      .story-list {
        display: grid;
        gap: 10px;
        font-size: 13px;
        line-height: 1.32;
        white-space: normal;
      }

      .story-row {
        padding-bottom: 9px;
        border-bottom: 1px solid rgba(56, 43, 24, 0.12);
      }

      .story-row:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }

      .story-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-weight: 800;
      }

      .story-status {
        padding: 1px 6px;
        border-radius: 999px;
        background: rgba(108, 87, 148, 0.12);
        color: #604f7e;
        font-size: 10px;
        font-weight: 800;
      }

      .story-text {
        display: block;
        margin-top: 4px;
        color: #5f4d3e;
      }

      .story-next {
        display: block;
        margin-top: 4px;
        color: #7c6754;
        font-size: 12px;
      }

      .event-name {
        display: block;
        margin-top: 2px;
        color: #33261b;
        font-size: 14px;
        font-weight: 800;
        overflow-wrap: anywhere;
      }

      .event-effects {
        display: grid;
        grid-template-columns: repeat(3, auto);
        gap: 5px;
        justify-content: end;
        align-items: center;
      }

      .event-pill {
        min-width: 34px;
        padding: 3px 5px;
        border-radius: 999px;
        background: rgba(56, 43, 24, 0.08);
        text-align: center;
        font-size: 11px;
        font-weight: 800;
      }

      .event-pill.neutral {
        color: #766553;
      }

      .summary-list {
        display: grid;
        gap: 8px;
        font-size: 13px;
        line-height: 1.32;
        white-space: normal;
      }

      .summary-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        padding-bottom: 6px;
        border-bottom: 1px solid rgba(56, 43, 24, 0.12);
      }

      .stats {
        position: absolute;
        left: 6%;
        bottom: 50%;
        display: grid;
        grid-template-columns: repeat(2, auto);
        gap: 6px 10px;
        padding: 10px 12px;
        border: 3px solid var(--ink);
        border-radius: 18px;
        background: rgba(255, 250, 241, 0.92);
        color: #33261b;
        font-size: 13px;
        font-weight: 700;
        box-shadow: 0 6px 0 rgba(45, 38, 27, 0.1);
        opacity: 1;
        transform: translateY(0);
        transition: opacity 150ms ease, transform 150ms ease;
      }

      .stats.hidden {
        opacity: 0;
        transform: translateY(-8px);
        pointer-events: none;
      }

      .stats span:nth-child(odd) {
        color: #7c6754;
      }

      .stats strong {
        text-align: right;
      }

      .stats .full-row {
        grid-column: 1 / -1;
        padding-top: 2px;
        color: #766553;
        font-size: 12px;
        text-align: right;
      }

      .stats .full-row.is-debt {
        color: #c43d37;
      }

      .activity {
        position: absolute;
        left: 39%;
        bottom: 28%;
        width: min(42%, 250px);
        padding: 9px 11px;
        border: 3px solid var(--ink);
        border-radius: 16px;
        background: rgba(255, 250, 241, 0.92);
        color: #33261b;
        font-size: 13px;
        font-weight: 700;
        opacity: 0;
        transform: translateY(-6px);
        transition: opacity 150ms ease, transform 150ms ease;
      }

      .activity.show {
        opacity: 1;
        transform: translateY(0);
      }

      .activity-bar {
        width: 100%;
        height: 7px;
        margin-top: 7px;
        border-radius: 999px;
        background: rgba(56, 43, 24, 0.16);
        overflow: hidden;
      }

      .activity-fill {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: var(--accent);
      }

      .menu {
        position: absolute;
        left: 50%;
        bottom: 15%;
        display: grid;
        grid-template-columns: repeat(3, 48px);
        gap: 8px;
        opacity: 0;
        transform: translate(-50%, 10px) scale(0.92);
        transform-origin: 50% 100%;
        transition: opacity 150ms ease, transform 150ms ease;
        pointer-events: none;
      }

      .menu.open {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
        pointer-events: auto;
      }

      .menu.submenu {
        grid-template-columns: repeat(4, 48px);
      }

      button {
        width: 48px;
        height: 48px;
        border: 3px solid var(--ink);
        border-radius: 16px;
        background: var(--paper);
        color: var(--ink);
        box-shadow: 0 5px 0 rgba(45, 38, 27, 0.16);
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }

      .bubble,
      .stats,
      .activity,
      .menu {
        -webkit-app-region: no-drag;
      }

      button:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 rgba(45, 38, 27, 0.16);
      }

      @keyframes sprite-bob {
        0%, 100% { transform: translateY(0) rotate(-0.4deg); }
        50% { transform: translateY(-8px) rotate(0.4deg); }
      }

      .pet.is-working .sprite-pet {
        animation: sprite-bob 2.2s ease-in-out infinite;
      }

      .pet.is-exercise .sprite-pet {
        animation: sprite-bob 1.8s ease-in-out infinite;
      }

      .pet.is-food .sprite-pet {
        animation: sprite-bob 2.2s ease-in-out infinite;
      }

      .pet.is-entertainment .sprite-pet {
        animation: sprite-bob 2s ease-in-out infinite;
      }

      .pet.is-skill .sprite-pet {
        animation: sprite-bob 2s ease-in-out infinite;
      }

      @keyframes shadow {
        0%, 100% { transform: translateX(-50%) scaleX(1); opacity: 0.2; }
        50% { transform: translateX(-50%) scaleX(0.86); opacity: 0.12; }
      }

    </style>
  </head>
  <body>
    <main class="pet-shell">
      <div class="drag-zone" id="dragZone"></div>
      <div class="shadow"></div>
      <section class="pet" id="pet" aria-label="宠物">
        <span class="sprite-pet" role="img" aria-label="Goku Forms Codex 宠物">
          <img class="sprite-sheet" src="../assets/codex-pets/goku-forms/spritesheet.webp" alt="" />
        </span>
      </section>
      <aside class="bubble" id="bubble" aria-live="polite">
        <span class="bubble-label" id="bubbleLabel">小技能</span>
        <span class="bubble-text" id="bubbleText">脚本运行完成
加班 2.5 小时</span>
      </aside>
      <section class="stats" id="stats" aria-label="宠物属性">
        <span>心情</span><strong id="mood">--</strong>
        <span>体重</span><strong id="weight">--</strong>
        <span>发量</span><strong id="hair">--</strong>
        <span>健康</span><strong id="health">--</strong>
        <span>金钱</span><strong id="money">--</strong>
        <strong class="full-row" id="debt">现金正常</strong>
      </section>
      <section class="activity" id="activity" aria-label="当前行动">
        <span id="activityText">待机</span>
        <div class="activity-bar"><div class="activity-fill" id="activityFill"></div></div>
      </section>
      <nav class="menu" id="menu" aria-label="互动菜单"></nav>
    </main>
    <script>
      const pet = document.getElementById("pet");
      const spritePet = document.querySelector(".sprite-pet");
      const menu = document.getElementById("menu");
      const bubble = document.getElementById("bubble");
      const bubbleLabel = document.getElementById("bubbleLabel");
      const bubbleText = document.getElementById("bubbleText");
      const dragZone = document.getElementById("dragZone");
      const statEls = {
        mood: document.getElementById("mood"),
        weight: document.getElementById("weight"),
        hair: document.getElementById("hair"),
        health: document.getElementById("health"),
        money: document.getElementById("money"),
        debt: document.getElementById("debt")
      };
      const activity = document.getElementById("activity");
      const activityText = document.getElementById("activityText");
      const activityFill = document.getElementById("activityFill");
      let hideTimer;
      let activityTimer;
      let busy = false;
      let loadedActions = [];
      let loadedSkills = [];
      let menuMode = "root";
      let activePetClass = "";
      let spriteTimer;
      let eventModeTimer;
      let spriteFrame = 0;
      let currentMode = "";
      let currentSpriteState = "";
      let messageQueue = [];
      let queuePlaying = false;

      const spriteStates = {
        idle: { row: 0, frames: 6, intervalMs: 460 },
        runningRight: { row: 1, frames: 8, intervalMs: 150 },
        runningLeft: { row: 2, frames: 8, intervalMs: 150 },
        waving: { row: 3, frames: 4, intervalMs: 240 },
        jumping: { row: 4, frames: 5, intervalMs: 200 },
        failed: { row: 5, frames: 7, intervalMs: 230 },
        waiting: { row: 6, frames: 6, intervalMs: 260 },
        running: { row: 7, frames: 6, intervalMs: 190 },
        review: { row: 8, frames: 6, intervalMs: 230 }
      };

      const categoryMeta = {
        work: { label: "工作", icon: "💼" },
        food: { label: "饮食", icon: "🍱" },
        exercise: { label: "运动", icon: "🏃" },
        entertainment: { label: "娱乐", icon: "🎲" },
        interaction: { label: "互动", icon: "🧩" },
        events: { label: "事件", icon: "📖" },
        stories: { label: "故事", icon: "📚" },
        skill: { label: "技能", icon: "✨" },
        settings: { label: "设置", icon: "⚙️" },
        developer: { label: "开发工具", icon: "🛠" }
      };
      let petSettings = { alwaysOnTop: true };

      function resetBubbleContent() {
        bubble.classList.remove("scrollable");
        bubble.classList.remove("tone-good", "tone-bad", "tone-urgent", "tone-soft", "tone-story");
        bubbleText.className = "bubble-text";
        bubbleText.replaceChildren();
      }

      function say(text, label = "宠物", durationMs = 5200, tone = "") {
        window.clearTimeout(hideTimer);
        resetBubbleContent();
        if (tone) {
          bubble.classList.add(`tone-${tone}`);
        }
        bubbleLabel.textContent = label;
        bubbleText.textContent = text;
        bubble.classList.add("show");
        hideTimer = window.setTimeout(() => bubble.classList.remove("show"), durationMs);
      }

      function enqueueBubble(text, label = "宠物", durationMs = 3600, priority = "normal", options = {}) {
        const item = { text, label, durationMs, ...options };
        if (priority === "urgent") {
          messageQueue.unshift(item);
        } else {
          messageQueue.push(item);
        }
        playBubbleQueue();
      }

      function playBubbleQueue() {
        if (queuePlaying || messageQueue.length === 0) {
          return;
        }
        queuePlaying = true;
        const item = messageQueue.shift();
        if (item.spriteState) {
          showEventPetReaction(item.spriteState, item.durationMs);
        }
        say(item.text, item.label, item.durationMs, item.tone || "");
        window.setTimeout(() => {
          queuePlaying = false;
          playBubbleQueue();
        }, item.durationMs + 300);
      }

      function moneyClass(amount) {
        const value = Number(amount) || 0;
        if (value > 0) return "money-income";
        if (value < 0) return "money-expense";
        return "neutral";
      }

      function signed(amount) {
        const value = Number(amount) || 0;
        return value > 0 ? `+${value}` : `${value}`;
      }

      function formatMoney(amount) {
        const value = Number(amount) || 0;
        return new Intl.NumberFormat("zh-CN", {
          style: "currency",
          currency: "CNY",
          maximumFractionDigits: 0
        }).format(value);
      }

      function debtLabelForMoney(amount, debt) {
        const value = Number(amount) || 0;
        if (value >= 0) return "";
        if (debt?.label) return debt.label;
        if (value > -10000) return "轻微透支";
        if (value > -50000) return "压力负债";
        return "严重负债";
      }

      function showLedger(entries) {
        window.clearTimeout(hideTimer);
        resetBubbleContent();
        bubble.classList.add("scrollable");
        bubbleLabel.textContent = "账本";
        const list = document.createElement("span");
        list.className = "ledger-list";
        if (!entries || entries.length === 0) {
          list.textContent = "账本还是空的\n等发生收入或支出后会记录在这里";
        } else {
          for (const entry of entries) {
            const row = document.createElement("span");
            row.className = "ledger-row";
            const meta = document.createElement("span");
            meta.className = "ledger-meta";
            meta.textContent = `${entry.date} ${entry.name}`;
            const amount = document.createElement("strong");
            amount.className = moneyClass(entry.amount);
            amount.textContent = `${signed(entry.amount)} / ${entry.balanceAfter}`;
            row.append(meta, amount);
            list.appendChild(row);
          }
        }
        bubbleText.appendChild(list);
        bubble.classList.add("show");
        hideTimer = window.setTimeout(() => bubble.classList.remove("show"), 52000);
      }

      function showEvents(entries) {
        window.clearTimeout(hideTimer);
        resetBubbleContent();
        bubble.classList.add("scrollable");
        bubbleLabel.textContent = "事件";
        const list = document.createElement("span");
        list.className = "event-list";
        if (!entries || entries.length === 0) {
          list.textContent = "暂无事件记录\n有生活事件发生后会记录在这里";
        } else {
          let currentDate = "";
          for (const entry of entries) {
            if (entry.date !== currentDate) {
              currentDate = entry.date;
              const day = document.createElement("span");
              day.className = "event-day";
              day.textContent = currentDate;
              list.appendChild(day);
            }
            const row = document.createElement("span");
            row.className = "event-row";
            if (entry.source === "followUp") row.classList.add("is-follow-up");
            if (entry.source === "realtime") row.classList.add("is-interlude");
            const main = document.createElement("span");
            main.className = "event-main";
            const date = document.createElement("span");
            date.className = "event-date";
            date.textContent = entry.category || "生活事件";
            const name = document.createElement("span");
            name.className = "event-name";
            name.textContent = entry.name;
            main.append(date, name);
            if (entry.storyLabel || entry.source) {
              const tags = document.createElement("span");
              tags.className = "event-tags";
              const storyTag = document.createElement("span");
              storyTag.className = "event-tag";
              storyTag.textContent = entry.storyLabel || (entry.source === "realtime" ? "在线插曲" : "生活事件");
              tags.appendChild(storyTag);
              if (entry.source === "followUp") {
                const followTag = document.createElement("span");
                followTag.className = "event-tag";
                followTag.textContent = "后续";
                tags.appendChild(followTag);
              }
              main.appendChild(tags);
            }

            const effects = document.createElement("span");
            effects.className = "event-effects";
            for (const [label, value] of [["钱", entry.moneyDelta || 0], ["心", entry.moodDelta || 0], ["康", entry.healthDelta || 0]]) {
              const pill = document.createElement("span");
              pill.className = `event-pill ${moneyClass(value)}`;
              pill.textContent = `${label}${signed(value)}`;
              effects.appendChild(pill);
            }
            row.append(main, effects);
            list.appendChild(row);
          }
        }
        bubbleText.appendChild(list);
        bubble.classList.add("show");
        hideTimer = window.setTimeout(() => bubble.classList.remove("show"), 52000);
      }

      function showStories(stories) {
        window.clearTimeout(hideTimer);
        resetBubbleContent();
        bubble.classList.add("scrollable");
        bubbleLabel.textContent = "故事";
        const list = document.createElement("span");
        list.className = "story-list";
        if (!stories || stories.length === 0) {
          list.textContent = "暂无进行中的故事\n有连续事件发生后会整理在这里";
        } else {
          for (const story of stories) {
            const row = document.createElement("span");
            row.className = "story-row";
            const title = document.createElement("span");
            title.className = "story-title";
            const name = document.createElement("span");
            name.textContent = story.title;
            title.appendChild(name);
            if (story.status) {
              const status = document.createElement("span");
              status.className = "story-status";
              status.textContent = story.status;
              title.appendChild(status);
            }
            const text = document.createElement("span");
            text.className = "story-text";
            text.textContent = story.summary;
            row.append(title, text);
            if (story.next) {
              const next = document.createElement("span");
              next.className = "story-next";
              next.textContent = story.next;
              row.appendChild(next);
            }
            list.appendChild(row);
          }
        }
        bubbleText.appendChild(list);
        bubble.classList.add("show");
        hideTimer = window.setTimeout(() => bubble.classList.remove("show"), 52000);
      }

      function showLedgerStats(stats) {
        window.clearTimeout(hideTimer);
        resetBubbleContent();
        bubble.classList.add("scrollable");
        bubbleLabel.textContent = `${stats.month || "本月"}统计`;
        const list = document.createElement("span");
        list.className = "summary-list";
        const rows = [
          ["收入", stats.income || 0],
          ["支出", stats.expense || 0],
          ["结余", stats.net || 0],
          ...Object.entries(stats.categories || {})
        ];
        for (const [label, value] of rows) {
          const row = document.createElement("span");
          row.className = "summary-row";
          const name = document.createElement("span");
          name.textContent = label;
          const amount = document.createElement("strong");
          amount.className = moneyClass(value);
          amount.textContent = signed(value);
          row.append(name, amount);
          list.appendChild(row);
        }
        bubbleText.appendChild(list);
        bubble.classList.add("show");
        hideTimer = window.setTimeout(() => bubble.classList.remove("show"), 52000);
      }

      function setSpriteFrame(row, col) {
        spritePet.style.setProperty("--sprite-row", row);
        spritePet.style.setProperty("--sprite-col", col);
      }

      function playSpriteState(stateName) {
        const state = spriteStates[stateName] || spriteStates.idle;
        window.clearInterval(spriteTimer);
        spriteFrame = 0;
        setSpriteFrame(state.row, 0);
        spriteTimer = window.setInterval(() => {
          spriteFrame = (spriteFrame + 1) % state.frames;
          setSpriteFrame(state.row, spriteFrame);
        }, state.intervalMs);
      }

      function setPetMode(mode, preferredSpriteState = "") {
        currentMode = mode || "";
        currentSpriteState = preferredSpriteState || "";
        const modeClass = {
          work: "working",
          food: "food",
          exercise: "exercise",
          entertainment: "entertainment",
          skill: "skill"
        }[mode] || mode;

        if (activePetClass) {
          pet.classList.remove(activePetClass);
        }

        activePetClass = modeClass ? `is-${modeClass}` : "";
        if (activePetClass) {
          pet.classList.add(activePetClass);
        }

        const stateName = preferredSpriteState || {
          working: "running",
          food: "waving",
          exercise: "jumping",
          entertainment: "waiting",
          skill: "review"
        }[modeClass] || "idle";
        playSpriteState(stateName);
      }

      function showEventPetReaction(spriteState, durationMs) {
        if (busy) return;
        const previousMode = currentMode;
        const previousSpriteState = currentSpriteState;
        window.clearTimeout(eventModeTimer);
        setPetMode("event", spriteState);
        eventModeTimer = window.setTimeout(() => {
          if (!busy) {
            setPetMode(previousMode, previousSpriteState);
          }
        }, Math.max(1200, durationMs - 300));
      }

      function actionEffectTitle(action) {
        const parts = [`${action.name} · ${Math.round(action.durationSeconds)}秒`];
        if (Number(action.moneyDelta || 0) !== 0) parts.push(`金钱${signed(action.moneyDelta)}`);
        if (Number(action.moodDelta || 0) !== 0) parts.push(`心情${signed(action.moodDelta)}`);
        if (Number(action.healthDelta || 0) !== 0) parts.push(`健康${signed(action.healthDelta)}`);
        return parts.join(" · ");
      }

      playSpriteState("idle");

      window.petSkillResult = (result) => {
        if (activePetClass === "is-skill") {
          setPetMode("");
        }
        say(result.text || "脚本运行完成", result.label || "小技能");
      };

      window.petStateUpdated = (state) => {
        statEls.mood.textContent = state.mood;
        statEls.weight.textContent = state.weight;
        statEls.hair.textContent = state.hair;
        statEls.health.textContent = state.health ?? "--";
        statEls.money.textContent = formatMoney(state.money);
        const debtLabel = debtLabelForMoney(state.money, state.debt);
        if (Number(state.money || 0) < 0) {
          statEls.money.title = debtLabel;
          statEls.money.className = "money-expense";
          statEls.debt.textContent = debtLabel;
          statEls.debt.classList.add("is-debt");
        } else if (Number(state.money || 0) === 0) {
          statEls.money.title = "现金为 0";
          statEls.money.className = "";
          statEls.debt.textContent = "现金为 0";
          statEls.debt.classList.remove("is-debt");
        } else {
          statEls.money.title = "";
          statEls.money.className = "";
          statEls.debt.textContent = "现金正常";
          statEls.debt.classList.remove("is-debt");
        }
      };

      window.petLedgerResult = (payload) => {
        showLedger(payload.entries || []);
      };

      window.petEventLogResult = (payload) => {
        showEvents(payload.entries || []);
      };

      window.petStoryResult = (payload) => {
        showStories(payload.stories || []);
      };

      window.petLedgerStatsResult = (payload) => {
        showLedgerStats(payload.stats || {});
      };

      window.petQueueEventMessages = (messages) => {
        const items = Array.isArray(messages) ? messages.slice(0, 4) : [];
        items.forEach((message, index) => {
          const duration = message.durationMs || (message.severity === "urgent" ? 7600 : 4200);
          enqueueBubble(message.text, message.label || "生活事件", duration, message.severity, {
            tone: message.tone || "",
            spriteState: message.spriteState || ""
          });
        });
      };

      window.petSettingsUpdated = (settings) => {
        petSettings = settings;
        document.getElementById("stats").classList.toggle("hidden", !settings.showStats);
        if (menu.classList.contains("open") && menuMode === "settings") {
          renderCategoryMenu("settings");
        }
      };

      window.petLoadActions = (actions) => {
        loadedActions = actions;
        renderRootMenu();
      };

      window.petLoadSkills = (skills) => {
        loadedSkills = skills;
        renderRootMenu();
      };

      function clearMenu() {
        menu.replaceChildren();
      }

      function createMenuButton({ icon, title, dataset }) {
        const button = document.createElement("button");
        button.type = "button";
        button.title = title;
        button.textContent = icon;
        for (const [key, value] of Object.entries(dataset)) {
          button.dataset[key] = value;
        }
        return button;
      }

      function renderRootMenu() {
        menuMode = "root";
        menu.classList.remove("submenu");
        clearMenu();

        if (loadedSkills.length > 0) {
          menu.appendChild(createMenuButton({
            icon: categoryMeta.skill.icon,
            title: categoryMeta.skill.label,
            dataset: { action: "openCategory", category: "skill" }
          }));
        }

        menu.appendChild(createMenuButton({
          icon: categoryMeta.events.icon,
          title: categoryMeta.events.label,
          dataset: { action: "showEvents" }
        }));
        menu.appendChild(createMenuButton({
          icon: categoryMeta.stories.icon,
          title: categoryMeta.stories.label,
          dataset: { action: "showStories" }
        }));

        if (loadedActions.length > 0) {
          menu.appendChild(createMenuButton({
            icon: categoryMeta.interaction.icon,
            title: categoryMeta.interaction.label,
            dataset: { action: "openCategory", category: "interaction" }
          }));
        }

        menu.appendChild(createMenuButton({
          icon: categoryMeta.settings.icon,
          title: categoryMeta.settings.label,
          dataset: { action: "openCategory", category: "settings" }
        }));
      }

      function renderCategoryMenu(category) {
        menuMode = category;
        menu.classList.add("submenu");
        clearMenu();

        menu.appendChild(createMenuButton({
          icon: "←",
          title: "返回",
          dataset: { action: "back" }
        }));

        if (category === "skill") {
          for (const skill of loadedSkills) {
            menu.appendChild(createMenuButton({
              icon: skill.icon || "✨",
              title: skill.name,
              dataset: {
                action: "skill",
                skillId: skill.id,
                skillName: skill.name
              }
            }));
          }
          return;
        }

        if (category === "interaction") {
          for (const action of loadedActions) {
            menu.appendChild(createMenuButton({
              icon: action.icon || "•",
              title: actionEffectTitle(action),
              dataset: {
                action: "petAction",
                actionId: action.id,
                actionName: action.name
              }
            }));
          }
          return;
        }

        if (category === "settings") {
          menu.appendChild(createMenuButton({
            icon: petSettings.alwaysOnTop ? "📌" : "📍",
            title: petSettings.alwaysOnTop ? "关闭置顶" : "开启置顶",
            dataset: { action: "toggleAlwaysOnTop" }
          }));
          menu.appendChild(createMenuButton({
            icon: petSettings.showStats ? "📊" : "▣",
            title: petSettings.showStats ? "隐藏状态面板" : "显示状态面板",
            dataset: { action: "toggleStats" }
          }));
          menu.appendChild(createMenuButton({
            icon: "账",
            title: "查看账本",
            dataset: { action: "showLedger" }
          }));
          menu.appendChild(createMenuButton({
            icon: "统",
            title: "月度统计",
            dataset: { action: "showLedgerStats" }
          }));
          menu.appendChild(createMenuButton({
            icon: categoryMeta.developer.icon,
            title: categoryMeta.developer.label,
            dataset: { action: "openCategory", category: "developer" }
          }));
          menu.appendChild(createMenuButton({
            icon: "⏻",
            title: "退出",
            dataset: { action: "quit" }
          }));
          return;
        }

        if (category === "developer") {
          const tools = [
            ["📋", "事件调试状态", { action: "showEventDebug" }],
            ["⏭", "推进一天结算", { action: "debugAdvanceDay" }],
            ["☁", "设为低心情", { action: "debugSetStatePreset", preset: "lowMood" }],
            ["✚", "设为低健康", { action: "debugSetStatePreset", preset: "lowHealth" }],
            ["￥", "设为负债", { action: "debugSetStatePreset", preset: "debt" }],
            ["↺", "重置默认值", { action: "debugResetState" }]
          ];
          for (const [icon, title, dataset] of tools) {
            menu.appendChild(createMenuButton({ icon, title, dataset }));
          }
          return;
        }

        for (const action of loadedActions.filter((item) => item.category === category)) {
          menu.appendChild(createMenuButton({
            icon: action.icon || "•",
            title: actionEffectTitle(action),
            dataset: {
              action: "petAction",
              actionId: action.id,
              actionName: action.name
            }
          }));
        }
      }

      window.petActivityStarted = (action) => {
        busy = true;
        window.clearInterval(activityTimer);
        const duration = Math.max(1, Number(action.durationSeconds) || 1);
        const startedAt = Date.now();
        const activeAction = loadedActions.find((item) => item.id === action.id);
        setPetMode(action.mode || activeAction?.mode || activeAction?.category || "working", action.spriteState || activeAction?.spriteState || "");
        activityText.textContent = `${action.name}中 · ${duration}秒`;
        activity.classList.add("show");
        activityFill.style.width = "0%";
        activityTimer = window.setInterval(() => {
          const elapsed = (Date.now() - startedAt) / 1000;
          const progress = Math.min(1, elapsed / duration);
          activityFill.style.width = `${Math.round(progress * 100)}%`;
          const left = Math.max(0, Math.ceil(duration - elapsed));
          activityText.textContent = `${action.name}中 · ${left}秒`;
        }, 200);
      };

      window.petActivityEnded = () => {
        busy = false;
        setPetMode("");
        window.clearInterval(activityTimer);
        activityFill.style.width = "100%";
        window.setTimeout(() => {
          activity.classList.remove("show");
          activityText.textContent = "待机";
          activityFill.style.width = "0%";
        }, 700);
      };

      pet.addEventListener("click", (event) => {
        event.stopPropagation();
        if (!menu.classList.contains("open")) {
          renderRootMenu();
        }
        menu.classList.toggle("open");
      });

      document.addEventListener("click", () => {
        menu.classList.remove("open");
        renderRootMenu();
      });

      document.addEventListener("contextmenu", (event) => {
        event.preventDefault();
        menu.classList.remove("open");
        renderRootMenu();
      });

      menu.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        event.stopPropagation();
        if (button.dataset.action === "openCategory") {
          renderCategoryMenu(button.dataset.category);
          return;
        }
        if (button.dataset.action === "back") {
          renderRootMenu();
          return;
        }
        if (button.dataset.action === "toggleAlwaysOnTop") {
          window.webkit?.messageHandlers?.pet?.postMessage({
            action: "toggleAlwaysOnTop"
          });
          return;
        }
        if (button.dataset.action === "toggleStats") {
          window.webkit?.messageHandlers?.pet?.postMessage({
            action: "toggleStats"
          });
          return;
        }
        if (button.dataset.action === "showEvents") {
          window.webkit?.messageHandlers?.pet?.postMessage({
            action: "showEvents"
          });
          menu.classList.remove("open");
          renderRootMenu();
          return;
        }
        if (button.dataset.action === "showStories") {
          window.webkit?.messageHandlers?.pet?.postMessage({
            action: "showStories"
          });
          menu.classList.remove("open");
          renderRootMenu();
          return;
        }
        if (button.dataset.action === "showLedger") {
          window.webkit?.messageHandlers?.pet?.postMessage({
            action: "showLedger"
          });
          return;
        }
        if (button.dataset.action === "showLedgerStats") {
          window.webkit?.messageHandlers?.pet?.postMessage({
            action: button.dataset.action
          });
          return;
        }
        if (["showEventDebug", "debugAdvanceDay", "debugResetState"].includes(button.dataset.action)) {
          window.webkit?.messageHandlers?.pet?.postMessage({
            action: button.dataset.action
          });
          menu.classList.remove("open");
          renderRootMenu();
          return;
        }
        if (button.dataset.action === "debugSetStatePreset") {
          window.webkit?.messageHandlers?.pet?.postMessage({
            action: "debugSetStatePreset",
            preset: button.dataset.preset
          });
          menu.classList.remove("open");
          renderRootMenu();
          return;
        }
        if (button.dataset.action === "quit") {
          window.webkit?.messageHandlers?.pet?.postMessage({
            action: "quit"
          });
          return;
        }
        if (button.dataset.action === "skill") {
          if (busy) {
            say("现在正在忙\n等当前行动结束再用小技能吧", "宠物");
            menu.classList.remove("open");
            renderRootMenu();
            return;
          }
          const skillName = button.dataset.skillName || "小技能";
          setPetMode("skill");
          say("正在运行脚本...", skillName);
          window.webkit?.messageHandlers?.pet?.postMessage({
            action: "runSkill",
            skillId: button.dataset.skillId
          });
        } else if (button.dataset.action === "petAction") {
          if (busy) {
            say("现在正在忙\n等当前行动结束再来吧", "宠物");
            menu.classList.remove("open");
            renderRootMenu();
            return;
          }
          say("准备开始...", button.dataset.actionName || "行动");
          window.webkit?.messageHandlers?.pet?.postMessage({
            action: "petAction",
            actionId: button.dataset.actionId
          });
        } else {
          const [text, label] = button.dataset.say.split("|");
          say(text, label);
        }
        menu.classList.remove("open");
        renderRootMenu();
      });

      dragZone.addEventListener("pointerdown", () => {
        window.webkit?.messageHandlers?.pet?.postMessage("drag");
      });
    </script>
  </body>
</html>
