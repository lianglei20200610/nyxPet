<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf4e9"/>
      <stop offset="1" stop-color="#e9f4f1"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe1bd"/>
      <stop offset="1" stop-color="#ffc28c"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79c7bd"/>
      <stop offset="1" stop-color="#4b9eaa"/>
    </linearGradient>
    <linearGradient id="vest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#364a59"/>
      <stop offset="1" stop-color="#25313d"/>
    </linearGradient>
    <style>
      .outline { stroke:#282421; stroke-width:7; stroke-linecap:round; stroke-linejoin:round; }
      .line { stroke:#282421; stroke-width:4.5; stroke-linecap:round; stroke-linejoin:round; fill:none; }
      .thin { stroke:#282421; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; fill:none; }
      .title { font-family: Arial, sans-serif; font-size:38px; font-weight:800; fill:#282421; }
      .h2 { font-family: Arial, sans-serif; font-size:25px; font-weight:700; fill:#282421; }
      .txt { font-family: Arial, sans-serif; font-size:20px; fill:#514b45; }
      .tiny { font-family: Arial, sans-serif; font-size:17px; fill:#514b45; }
      .skin { fill:url(#skin); }
      .hair { fill:#332823; }
      .hair2 { fill:#594139; }
      .shirt { fill:url(#shirt); }
      .vest { fill:url(#vest); }
      .pants { fill:#4e5e6d; }
      .shoe { fill:#2f2d2a; }
      .tie { fill:#e35e52; }
      .paper { fill:#fff8e9; }
      .blush { fill:#f69a88; opacity:.62; }
      .shadow { fill:#cbbda7; opacity:.45; }
      .coin { fill:#f5c54a; }
      .warn { fill:#f07a5f; }
      .blue { fill:#80b7df; }
      .green { fill:#81c784; }
      .cream { fill:#fff2cf; }
    </style>
  </defs>

